# dsh-mcp-manager bundle patch.
# Installed via `dsh plugin --profile web add @wanghailong0419/dsh-mcp-manager`;
# `dsh plugin` auto-activates this bundle because it declares dsh.bundle.
#
# One entry mounts both halves of the package:
#   - host half (lib/index.js): the mcpInventory Remote service
#   - client half (lib/client.js): the Settings "MCP servers" section,
#     discovered by dsh-client-modules through the dsh.client declaration.
- insert:
    - id: dsh-mcp-manager
      name: '@wanghailong0419/dsh-mcp-manager'
